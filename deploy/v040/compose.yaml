name: ${W2F_PROJECT:?Set a dedicated v0.4.0 project}
services:
  gateway:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    ports:
      - "${W2F_BIND_IP:-127.0.0.1}:${W2F_PORT:-13040}:3040"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${W2F_STATE:?Set a dedicated state directory}/tls:/etc/w2f/tls:ro
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [ALL]
    # The official binary carries this file capability and needs it in the bounding set.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    depends_on:
      app:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  app:
    image: ${W2F_IMAGE:?Set an immutable image tag}
    restart: unless-stopped
    environment:
      W2F_CLOUD_ENVIRONMENT: ${W2F_ENVIRONMENT:?Set the environment}
      W2F_CLOUD_DATA_DIR: /var/lib/w2f
      W2F_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      W2F_DATABASE_PASSWORD_FILE: /run/secrets/database_password
    secrets: [admin_password, database_password]
    volumes:
      - media:/var/lib/w2f
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1
    pids_limit: 100
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=8)"]
      interval: 10s
      timeout: 9s
      retries: 6
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: w2f
      POSTGRES_USER: w2f
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U w2f -d w2f"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    cpus: 1
    pids_limit: 150
    logging: *logging
  sender:
    image: ${W2F_IMAGE:?Set an immutable image tag}
    command:
    - python
    - -m
    - cloud.sender
    restart: unless-stopped
    environment:
      W2F_CLOUD_ENVIRONMENT: ${W2F_ENVIRONMENT:?Set the environment}
      W2F_CLOUD_DATA_DIR: /var/lib/w2f
      W2F_DATABASE_PASSWORD_FILE: /run/secrets/database_password
      W2F_FEISHU_CREDENTIALS_FILE: /run/secrets/feishu_apps
    secrets:
    - database_password
    - feishu_apps
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - cloud.sender
      - --health
      interval: 10s
      timeout: 9s
      retries: 6
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

secrets:
  admin_password:
    file: ${W2F_STATE}/secrets/admin_password
  database_password:
    file: ${W2F_STATE}/secrets/database_password
  feishu_apps:
    file: ${W2F_STATE}/secrets/feishu_apps.json

volumes:
  postgres:
  media:
