name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-qa.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run isolated checks and confirm failures
        id: qa
        continue-on-error: true
        run: python -m qa.run --output .qa-results/ci
      - name: Upload structured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.os }}
          path: .qa-results/ci/
          if-no-files-found: error
          retention-days: 14
      - run: python scripts/check_public_tree.py
      - name: Require complete passing verification
        if: steps.qa.outcome != 'success'
        run: python -c "raise SystemExit('Functional failures, flaky checks, or blocked environment; see QA artifact')"

  publish:
    needs: test
    # PR code never receives an issue-write token. Only trusted main runs publish.
    if: >-
      always() && !cancelled() &&
      github.repository == 'litianc/w2f-cli' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: w2f-functional-qa-issues
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qa-*
          path: .qa-results/platforms
      - name: Publish only repeatable new findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m qa.ci_publish .qa-results/platforms --max-new 3
